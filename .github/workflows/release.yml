# Builds Outline for macOS, Windows and Linux on GitHub's machines.
#
# - Pushing a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`)
#   creates a draft release and uploads every installer and signed update
#   payload to it. The files always have the same names, so the README's
#   …/releases/latest/download/<file> links point at the newest version.
#   The release stays a draft: write its notes on GitHub (the update window
#   shows them), run `npm run release:finish` to add the update manifest,
#   then publish it (see RELEASING.md).
# - Running it by hand (Actions → Release → Run workflow) only builds, and
#   keeps the installers as downloadable "artifacts" on the run, so a build
#   can be tried without publishing anything.
#
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (the updater key;
# see RELEASING.md), which signs the update payloads.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A draft, with empty notes to be written on GitHub.
      - run: gh release create "$GITHUB_REF_NAME" --draft --title "Outline ${GITHUB_REF_NAME#v}" --notes ""
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: create-release
    # Also run when started by hand, when create-release is skipped.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: mac-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: mac-x64, os: macos-latest, target: x86_64-apple-darwin }
          - { name: win-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          # An older Ubuntu, so the Linux builds run on older systems too.
          - { name: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Check the updater key is there
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret isn't set, so the update payloads can't be signed (see RELEASING.md)."
            exit 1
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - run: npm run tauri build -- --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - name: Collect installers under fixed names
        shell: bash
        run: node scripts/release.mjs collect ${{ matrix.name }} src-tauri/target/${{ matrix.target }}/release installers

      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" installers/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Keep as a test build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: Outline-${{ matrix.name }}
          path: installers/*
