<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Outline</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <!-- On macOS the title bar is hidden and this toolbar takes its place (see tauri.conf.json). -->
    <header class="toolbar" data-tauri-drag-region>
      <div class="brand" data-tauri-drag-region>
        <span id="document-name" class="document-name" data-tauri-drag-region>Untitled</span>
      </div>
      <!-- The ribbon's tabs; their buttons go in #ribbon below (see ribbon.ts). -->
      <div class="toolbar-middle" data-tauri-drag-region>
        <div id="ribbon-tabs" data-tauri-drag-region></div>
      </div>
      <div class="toolbar-end" data-tauri-drag-region>
        <label class="search">
          <span data-icon="search"></span>
          <input id="search" type="search" placeholder="Search" aria-label="Search" autocomplete="off" spellcheck="false" />
        </label>
        <div class="pill">
          <button data-action="filter" data-icon="filter" title="Filter" aria-label="Filter"></button>
        </div>
      </div>
    </header>
    <div id="ribbon" class="ribbon-host"></div>

    <div class="workspace">
      <aside id="sidebar"></aside>
      <!-- The open outlines: their tabs, any filters, then the outline itself. -->
      <section class="document panel">
        <nav id="tabs" class="tabs" aria-label="Open outlines"></nav>
        <div id="filter-bar" class="filter-bar" hidden></div>
        <main id="outline"></main>
      </section>
    </div>

    <dialog id="prompt">
      <form method="dialog">
        <label for="prompt-input" id="prompt-label"></label>
        <input id="prompt-input" type="text" autocomplete="off" spellcheck="false" />
        <textarea id="prompt-area" rows="8" spellcheck="false" hidden></textarea>
        <menu>
          <button type="button" data-cancel>Cancel</button>
          <button value="ok" class="primary">OK</button>
        </menu>
      </form>
    </dialog>

    <dialog id="zotero" class="zotero">
      <form method="dialog">
        <label class="search">
          <span data-icon="search"></span>
          <input id="zotero-query" type="search" placeholder="Search your Zotero library" aria-label="Search Zotero" autocomplete="off" spellcheck="false" />
        </label>
        <div id="zotero-status" class="zotero-status"></div>
        <div id="zotero-results" class="zotero-results"></div>
        <menu>
          <button type="button" data-cancel>Cancel</button>
          <button value="ok" id="zotero-link" class="primary">Link</button>
        </menu>
      </form>
    </dialog>
  </body>
</html>
