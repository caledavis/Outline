<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Outline</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <header class="toolbar">
      <div class="group">
        <button data-action="sidebar" data-icon="sidebar" title="Show or hide the sidebar (Mod+\)" aria-label="Sidebar"></button>
      </div>
      <div class="divider"></div>
      <div class="group">
        <button data-action="new" data-icon="file-plus" title="New (Mod+N)" aria-label="New"></button>
        <button data-action="open" data-icon="folder-open" title="Open… (Mod+O)" aria-label="Open"></button>
        <button data-action="save" data-icon="save" title="Save (Mod+S)" aria-label="Save"></button>
      </div>
      <div class="divider"></div>
      <div class="group">
        <button data-action="bold" data-mark="bold" data-icon="bold" title="Bold (Mod+B)" aria-label="Bold"></button>
        <button data-action="italic" data-mark="italic" data-icon="italic" title="Italic (Mod+I)" aria-label="Italic"></button>
        <button data-action="underline" data-mark="underline" data-icon="underline" title="Underline (Mod+U)" aria-label="Underline"></button>
        <button data-action="strike" data-mark="strike" data-icon="strikethrough" title="Strikethrough" aria-label="Strikethrough"></button>
        <button data-action="link" data-mark="link" data-icon="link" title="Link (Mod+K)" aria-label="Link"></button>
      </div>
      <div class="divider"></div>
      <div class="group">
        <button data-action="note" data-icon="note" title="Add or edit note (Mod+')" aria-label="Note"></button>
        <button data-action="attach" data-icon="attach" title="Attach a file or web link" aria-label="Attach"></button>
        <button data-action="cite" data-icon="cite" title="Link to an item in Zotero" aria-label="Zotero"></button>
      </div>
      <div class="divider"></div>
      <div class="group">
        <button data-action="smaller" data-icon="smaller" title="Smaller text (Mod+−)" aria-label="Smaller text"></button>
        <button data-action="reset-size" data-icon="reset-size" title="Reset text size" aria-label="Reset text size"></button>
        <button data-action="larger" data-icon="larger" title="Larger text (Mod++)" aria-label="Larger text"></button>
      </div>
      <div class="toolbar-spacer"></div>
      <label class="search">
        <span data-icon="search"></span>
        <input id="search" type="search" placeholder="Search" aria-label="Search" autocomplete="off" spellcheck="false" />
      </label>
      <button data-action="filter" data-icon="filter" title="Filter" aria-label="Filter"></button>
    </header>
    <div id="filter-bar" class="filter-bar" hidden></div>

    <div class="workspace">
      <aside id="sidebar"></aside>
      <main id="outline"></main>
    </div>

    <dialog id="prompt">
      <form method="dialog">
        <label for="prompt-input" id="prompt-label"></label>
        <input id="prompt-input" type="text" autocomplete="off" spellcheck="false" />
        <textarea id="prompt-area" rows="8" spellcheck="false" hidden></textarea>
        <menu>
          <button type="button" data-cancel>Cancel</button>
          <button value="ok" class="primary">OK</button>
        </menu>
      </form>
    </dialog>

    <dialog id="zotero" class="zotero">
      <form method="dialog">
        <label class="search">
          <span data-icon="search"></span>
          <input id="zotero-query" type="search" placeholder="Search your Zotero library" aria-label="Search Zotero" autocomplete="off" spellcheck="false" />
        </label>
        <div id="zotero-status" class="zotero-status"></div>
        <div id="zotero-results" class="zotero-results"></div>
        <menu>
          <button type="button" data-cancel>Cancel</button>
          <button value="ok" id="zotero-link" class="primary">Link</button>
        </menu>
      </form>
    </dialog>
  </body>
</html>
